<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IA SDR — administração</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="contas.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">IA</span>
    <span class="brand-name">IA SDR</span>
  </div>
  <nav class="tabs">
    <a class="tab" href="/">Painel</a>
    <button class="tab active">Administração</button>
  </nav>
  <div class="topbar-right">
    <span class="mode" id="quem"></span>
    <button class="btn ghost sm" id="sair">Sair</button>
  </div>
</header>

<main>
  <h1>Administração</h1>
  <p class="sub">Usuários, gastos e o que está acontecendo no sistema.</p>

  <div class="stats" id="totais"></div>

  <div class="box" style="margin-bottom:16px">
    <div class="box-head"><h2>Gasto por dia (últimos 14 dias)</h2><span class="summary" id="pico"></span></div>
    <div class="grafico" id="grafico"></div>
  </div>

  <div class="results-head">
    <h2>Usuários <span class="count" id="qtd-usuarios">0</span></h2>
    <button class="link" id="novo-usuario">criar usuário</button>
  </div>

  <div class="table-wrap">
    <table class="tabela" id="tabela-usuarios">
      <thead>
        <tr>
          <th>Usuário</th><th>Gasto (mês)</th><th>Gasto total</th><th>Limite</th>
          <th>Buscas</th><th>Leads</th><th>Ligações</th><th>Atendidas</th><th>Status</th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="box" style="margin-top:16px">
    <div class="box-head"><h2>Gasto por tipo de operação</h2></div>
    <div class="table-wrap">
      <table class="tabela" id="tabela-tipos">
        <thead><tr><th>Operação</th><th>Chamadas</th><th>Gasto</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="detalhe" class="box" style="margin-top:16px" hidden>
    <div class="box-head"><h2 id="detalhe-titulo">Detalhe</h2><button class="link" id="fechar-detalhe">fechar</button></div>
    <div id="detalhe-corpo" class="detalhe-corpo"></div>
  </div>
</main>

<div id="toast" class="toast" hidden></div>
<script src="admin.js"></script>
</body>
</html>
